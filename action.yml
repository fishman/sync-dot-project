name: sync-dot-project
description: >-
  Pull a CNCF project's dot-project files (OWNERS, CONTRIBUTING.md, LICENSE,
  CODE_OF_CONDUCT, SECURITY) from a source repo and propose them to this repo
  as a reviewed pull request. Reads a sync-dot-project.yml config (source
  org/repo@branch + files list). Dry-run by default - logs the proposed diff
  without opening a PR. Runs in each target repo with the repo-scoped default
  GITHUB_TOKEN; no org-wide secret is used.
inputs:
  config:
    description: Path to the sync-dot-project.yml config (source + files list)
    default: sync-dot-project.yml
  placeholder:
    description: >-
      Legacy fallback: a literal {org}/{repo} string in the CONTRIBUTING
      template replaced with this repo, for templates that hardcode one (e.g.
      Project-HAMi/.project). Prefer the @ORG@/@REPO@ variables. Disabled by
      default.
    default: ''
  dry-run:
    description: Log the proposed diff without opening a pull request
    default: 'true'
  pr-branch:
    description: Branch the pull request is based on
    default: sync-dot-project
  title:
    description: Pull request title
    default: 'chore: sync dot-project files'
  commit-message:
    description: Commit message for the sync
    default: 'chore: sync dot-project files'
runs:
  using: composite
  steps:
    - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Generate dot-project files
      shell: bash
      run: |
        pip install pyyaml
        python3 "${{ github.action_path }}/sync.py" \
          --config "${{ inputs.config }}" \
          --placeholder "${{ inputs.placeholder }}"
    - name: Propose pull request
      uses: peter-evans/create-pull-request@b99c9ae23bcf83f0f5aa571c2f0093de8aa85036
      with:
        branch: ${{ inputs.pr-branch }}
        title: ${{ inputs.title }}
        commit-message: ${{ inputs.commit-message }}
        delete-branch: true
        dry-run: ${{ inputs.dry-run }}
