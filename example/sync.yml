# Example workflow: propose dot-project file syncs to THIS repo from a source.
# Copy to .github/workflows/sync.yml in each repo you want synced.
# GITHUB_TOKEN is repo-scoped - no org-wide secret needed.

name: Sync Dot-Project

on:
  schedule:
    - cron: "0 7 * * 1"   # weekly, Monday 07:00
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: your-org/sync-dot-project@v1
        with:
          config: sync-dot-project.yml
          # set dry-run: false once you've reviewed a dry-run log
